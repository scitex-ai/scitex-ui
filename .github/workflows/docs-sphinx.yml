# Renamed from `rtd-sphinx-build-on-ubuntu-latest.yml`, which named a runner
# this job stopped using. A filename asserting `ubuntu-latest` while the job
# runs elsewhere is a claim nothing checks — the same read-the-label-not-the-
# thing shape this repo keeps hitting. The new name makes no runner claim at
# all, so it cannot go stale; the runner is now the CI_RUNS_ON variable, which
# is why the old name would have gone stale a second time.
#
# THIS IS NOT THE ORG REUSABLE, and the difference is deliberate. `ci.yml` also
# calls `scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml` (job
# `docs-sphinx`), so sphinx builds TWICE per PR. That is real duplication on
# contended runners, but the two are not interchangeable:
#
#   org reusable   sphinx-build -b html          (warnings tolerated)
#   this workflow  sphinx-build -W -b html       on PRs — warnings FAIL
#                  + refreshes src/scitex_ui/_sphinx_html/ on develop push
#
# So deleting this one to remove the duplicate build would silently drop
# warnings-as-errors AND the bundle refresh. If the duplication is worth
# closing, the way is to move `-W` into the org reusable first and leave only
# the bundle refresh here — not to delete this file. Recorded rather than done,
# because raising strictness fleet-wide is the org workflow owner's call.
#
# Renaming is safe for branch protection: develop requires only
# pytest-matrix x3 and typecheck (verified against the API, not assumed), and
# this workflow's check name comes from `name:` + the job id, never the
# filename.
name: docs

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  sphinx:
    # Skip when HEAD is the bot's own previous docs auto-commit — breaks
    # the infinite loop without using `[skip ci]`, which would also
    # suppress the tag-push and release workflows when the auto-commit
    # is the most recent commit on develop at release time.
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    # Follows CI_RUNS_ON like every other PR leg. It was `ubuntu-latest`, then
    # hardcoded `spartan-cpu`; both were destinations written into this file,
    # and the PS-224 lesson that produced the second one applies to the whole
    # class: GitHub does not reject an unmatchable job, it queues it forever,
    # so a job pointed at a destination nothing serves never fails — it just
    # never runs. A variable does not make that impossible, so whoever sets
    # CI_RUNS_ON owns checking the label has live runners. That check now
    # happens ONCE, for the repo, instead of once per file someone remembers.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-org-cpu"]') }}
    permissions:
      contents: write
    steps:
      # FORK GUARD — MUST BE THE FIRST STEP, AHEAD OF actions/checkout, which is
      # what first puts fork-authored content on the node. Sphinx makes the
      # exposure concrete: conf.py is arbitrary Python that the build EXECUTES,
      # so a fork PR touching docs/ runs its own code here.
      #
      # This job also declares `permissions: contents: write` and passes a token
      # to checkout, which is why it is worth guarding even though it gates
      # nothing: the blast radius is larger than the pytest legs', not smaller.
      #
      # Declared LOCALLY, so the guard added to the five reusable workflows in
      # scitex-ai/.github (#23) does not reach it. Refuses rather than
      # re-routing to a hosted runner — operator mandate 2026-07-14 (PS-169)
      # forbids those with no exceptions, and operator 2026-07-30 forbids
      # university resources for external code. FAILS rather than skipping.
      - name: Refuse to run fork-authored code on self-hosted infrastructure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "::error title=Fork PR blocked::Fork-authored code is not run on the self-hosted Spartan pool."
          echo "head repo: ${{ github.event.pull_request.head.repo.full_name }}  base repo: ${{ github.repository }}"
          echo "To review this contribution, adopt its branch into ${{ github.repository }} and open a same-repo PR:"
          echo "  gh pr checkout ${{ github.event.pull_request.number }} && git push origin HEAD:review/pr-${{ github.event.pull_request.number }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Into a venv, not the interpreter. The self-hosted runner's toolcache
      # Python is uv-managed, so a bare `pip install -e` dies with PEP 668
      # "externally-managed-environment" — which is the runner protecting
      # itself, not a fault to override with --break-system-packages. A venv
      # is the supported answer and costs nothing.
      - name: Install package + docs deps
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install --upgrade pip
          .venv-docs/bin/python -m pip install -e ".[docs]"

      - name: Build Sphinx HTML (warnings fail PRs only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            .venv-docs/bin/sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html
          else
            .venv-docs/bin/sphinx-build -b html docs/sphinx docs/sphinx/_build/html
          fi

      - name: Refresh src/scitex_ui/_sphinx_html/ (develop push only)
        # main is PR-only — its _sphinx_html/ bundle arrives via the
        # develop -> main PR. Direct bot-pushes to main are inhibited
        # so the branch history stays linear-via-PR.
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          rm -rf src/scitex_ui/_sphinx_html
          cp -rf docs/sphinx/_build/html src/scitex_ui/_sphinx_html
          touch src/scitex_ui/_sphinx_html/.nojekyll

      - name: Commit refreshed HTML if it changed (develop push only)
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          if [ -n "$(git status --porcelain src/scitex_ui/_sphinx_html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/scitex_ui/_sphinx_html
            git commit -m "docs(sphinx_html): refresh from CI build"
            git push
          fi
