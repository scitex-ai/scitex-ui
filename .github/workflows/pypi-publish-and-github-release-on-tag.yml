name: release

# Tag-driven release pipeline — SELF-HOSTED (Spartan CPU) via the scitex-ci SIF.
#
# The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest INSIDE the SIF. Must pass or the pipeline
#                      halts; nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist built INSIDE the SIF, uploaded as artifact.
#   3. publish       — PyPI via MANUAL OIDC trusted publishing INSIDE the SIF.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#
# develop→main promotion is a DELIBERATE, separate PR (operator policy);
# this pipeline never auto-syncs main.
#
# WHY the SIF (operator standardization 2026-06-18, fleet canary 2026-06-21):
# the Spartan compute runners have NO Python on the bare node, so the old
# `actions/setup-python@v5` step failed at init ("version 3.x not found for
# this OS"). The working pytest-matrix CI runs INSIDE the pre-built, reused
# scitex-ci SIF (`apptainer exec ci-cpu.sif`), which bakes python 3.11/3.12/
# 3.13 + pip + uv + fd at /opt/venv-<ver>. This release pipeline mirrors that:
#   - test/build run `bash .github/ci/exec-in-sif.sh <inner>.sh <pyver>`.
#   - publish CANNOT use pypa/gh-action-pypi-publish (a Docker action; the
#     compute nodes have no Docker), so it does MANUAL OIDC trusted publishing
#     inside the SIF (.github/ci/publish-in-sif.sh): GitHub OIDC JWT →
#     PyPI mint-token → twine upload. Trust config on PyPI is unchanged.
#   - actions/checkout, upload/download-artifact, codecov are JS actions and
#     run fine on the self-hosted runner.
# fail-loud: a missing SIF/shim/interpreter is a HARD error, never a
# bare-runner fallback.
#
# RUNS-ON WAS PINNED TO `spartan-cpu` HERE. UNPINNED 2026-08-22, precondition
# met. The note below is kept because the REASONING still governs any future
# change, and because the precondition is the whole story.
#
# THE DEPENDENCY: every job below runs inside SCITEX_CI_SIF
# (~/.scitex/dev/containers/ci-cpu.sif) via SCITEX_CI_APPTAINER — tests, wheel
# build, and the OIDC publish. `scitex-ci` is a POOL label, so pointing these
# jobs at it means "any machine serving that label". On 2026-08-05 those
# machines had apptainer but NOT the SIF, which is why this was pinned.
#
# WHY IT FAILS SILENTLY IF YOU GET IT WRONG, and this has not changed:
# pull-request CI never touches these paths. A repo can move its PR legs to the
# pool, stay green for weeks, then fail on its FIRST TAG — the one moment
# nobody wants a surprise. Green PRs are NOT evidence the release path survived
# the migration, because they never exercised it. Do not reason from "the pool
# already builds this repo"; it does not build it this way.
#
# THE PRECONDITION, AND HOW IT WAS DISCHARGED (2026-08-22). The note asked that
# ci-cpu.sif EXIST at the destination — "not once the runners are up, which is
# a different fact" — and that it be verified by READING THE FILE on those
# machines rather than by having run a copy. Read, over ssh:
#
#     scitex-compute-01   ci-cpu.sif  1221599232 bytes  Aug  5 14:23   runner ONLINE
#     scitex-compute-02   host key verification failed                 runner OFFLINE
#     scitex-compute-03   ci-cpu.sif  1221599232 bytes  Aug  5 14:18   runner ONLINE
#     scitex-compute-04   ci-cpu.sif  1221599232 bytes  Aug  5 14:23   runner ONLINE
#
# Every ONLINE machine serving `scitex-org-cpu` (which is what CI_RUNS_ON is
# set to) carries the SIF, identical size on all three.
#
# RESIDUAL RISK, stated rather than smoothed over: scitex-compute-02 could not
# be read (host key verification failed) and is currently OFFLINE, so it cannot
# take a job today. If it returns to the pool WITHOUT the SIF, a release landing
# on it hard-fails — which is the designed `fail-loud` behaviour, is visible,
# and is re-runnable. That is strictly better than the state this change fixes:
# a release pinned to a pool with ZERO online runners sits `queued` forever,
# never fails, and tells nobody.
#
# WHY IT WAS UNPINNED: on 2026-08-22 all four `spartan-cpu` runners were
# offline, so the v0.17.0 publish could not start at all. The pin had become
# the thing preventing releases rather than the thing protecting them.
# Tracked: cards scitex-ui-ci-still-100pct-spartan-after-ruling-20260805 and
# ci-spartan-cpu-runner-pool-entirely-offline-20260822.
#
# SIF + apptainer paths come from SCITEX_CI_SIF / SCITEX_CI_APPTAINER.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # SIF-based self-hosted test run — mirrors pytest-matrix exactly. No
      # setup-python (the bare Spartan node has no Python tool cache; that step
      # failed "version not found for this OS"); no apt fd-install (fd is baked
      # in the SIF). exec-in-sif.sh apptainer-execs the reused ci-cpu.sif and
      # run-in-sif.sh layers THIS (tagged) checkout + [all,dev] into a writable
      # target, then runs pytest. fail-loud on a missing SIF/shim.
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}

  build:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # Build INSIDE the SIF (no setup-python on the bare Spartan node).
      # build-in-sif.sh installs the `build` frontend into a writable --target
      # inside the SIF, then `python -m build` → dist/. fail-loud on empty dist.
      # build-in-sif.sh ends with the release gate: the built artifacts must
      # declare the tagged version AND carry the js/app bundles consumers load
      # with a <script> tag. The tag is passed explicitly so a workflow_dispatch
      # re-publish (where GITHUB_REF is a branch, not a tag) is gated too.
      - name: Build wheel + sdist in the CI SIF, then gate against the tag
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12 ${{ steps.ver.outputs.version }}
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-ui
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    permissions:
      id-token: write
    steps:
      # Need the repo checked out so .github/ci/exec-in-sif.sh +
      # publish-in-sif.sh are on disk (the build job uploaded only dist/).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Manual OIDC trusted publishing INSIDE the SIF — pypa/gh-action-pypi-
      # publish is a Docker action and the Spartan compute nodes have no Docker.
      # publish-in-sif.sh: GitHub OIDC JWT (audience=pypi) → PyPI mint-token →
      # twine upload dist/*. apptainer exec (no --cleanenv) passes the
      # ACTIONS_ID_TOKEN_REQUEST_* env vars into the SIF. fail-loud at each step.
      - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
        run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12

  release:
    needs: [build, publish]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      # JS action that talks to the GitHub Releases API directly. The bare
      # Spartan self-hosted runner has no reliable `gh` CLI (broken/absent
      # config), so the old `gh release create` failed AFTER publish — PyPI
      # shipped but no Release page (hit on v0.6.4). JS actions run fine on
      # the self-hosted runner (same class as actions/checkout +
      # upload-artifact), so this is the fail-loud-safe equivalent: CHANGELOG
      # notes + dist/* assets, no `gh` dep. Uses `permissions: contents:
      # write` (already set) + ${{ github.token }} by default. Same fix
      # already applied fleet-wide in scitex-writer/todo/dev/dataset/
      # agent-container (ci-gh-selfhosted-release-guard).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
