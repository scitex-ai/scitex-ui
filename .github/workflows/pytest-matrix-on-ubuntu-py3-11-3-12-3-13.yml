name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  test:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Fallback chain: prefer [all,dev] so optional-dep code paths
          # (fastmcp, click, scitex-dev) get exercised. Falls back to [dev]
          # then plain editable so a packaging hiccup doesn't strand CI.
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Run tests
        run: |
          pytest tests/ --cov=src/scitex_ui --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        env:
          # Per-matrix-job HOME so the codecov uploader's git/config writes
          # never collide between parallel python-version jobs that share
          # the runner workspace path.
          HOME: ${{ runner.temp }}/codecov-home-${{ matrix.python-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          disable_safe_directory: true
