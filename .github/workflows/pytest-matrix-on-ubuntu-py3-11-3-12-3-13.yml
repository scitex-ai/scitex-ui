name: tests

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers preserved verbatim from the prior local file. The prior local
# job ran on `ubuntu-latest` with `actions/setup-python` + pip; the reusable
# workflow instead runs on the self-hosted `spartan-cpu` runner with `uv`
# (same as the org's canonical CI) — a deliberate infra-standardization,
# not a functional change to the pytest suite itself.
#
# NOTE: the prior local job uploaded to Codecov on EVERY matrix leg (with a
# per-leg isolated HOME to avoid git-config collisions) instead of just the
# 3.12 leg, and had no per-leg HOME isolation concern in the reusable
# workflow (which only uploads on 3.12, `runner.temp` isn't reused across
# matrix jobs anyway). Coverage-upload behavior changes slightly (fewer
# Codecov uploads) but pytest itself still runs unconditionally on all 3
# versions — flagged for awareness, not a functional test regression.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  pytest-matrix:
    # New required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit
