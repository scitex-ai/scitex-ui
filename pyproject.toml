[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-ui"
version = "0.14.1"
description = "Shared frontend UI components for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    {name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"},
]
keywords = [
    "ui",
    "components",
    "frontend",
    "django",
    "typescript",
    "scitex",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: JavaScript",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "django",
    # `click` is a HARD core dep — the `scitex-ui` console-script
    # (`scitex_ui._cli:main`) does an UNGUARDED module-load `import click`
    # at `src/scitex_ui/_cli.py:12`. Without it in core, bare
    # `pip install scitex-ui` followed by `scitex-ui --help` raises
    # ModuleNotFoundError. PS-213 console-script-deps-must-be-core
    # (scitex-dev v0.17.10+) enforces this rule ecosystem-wide.
    "click>=8.0.0",
]

[project.scripts]
scitex-ui = "scitex_ui._cli:main"

[project.optional-dependencies]
cli = [
    "scitex-dev>=0.11.7",
]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    # tests/develop/test_packaging.py builds a wheel to inspect its CONTENTS.
    # hatchling is listed explicitly so that build can run --no-isolation and
    # stay offline; without it the build downloads a backend and can hang.
    "build>=1.0",
    "hatchling>=1.20",
    "click>=8.0.0",  # tests/scitex_ui/test__cli.py
    "fastmcp>=2.0.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-ui[cli]",
    "scitex-ui[mcp]",
    "scitex-ui[dev]",
    "scitex-ui[docs]",
]

[project.entry-points."scitex_dev.docs"]
scitex-ui = "scitex_ui"

[project.entry-points."scitex_dev.skills"]
scitex-ui = "scitex_ui"

# UI-101..105 component-usage rules (operator directive 2026-06-14,
# lead a2a `1f135ad4…`). Registers the rule corpus with scitex-dev's
# linter for discoverability via `scitex-linter list-rules`. Active
# scanning of *.css / *.html / *.tsx happens via `scitex-ui lint`
# (see src/scitex_ui/_linter/_cli.py) since scitex-dev's in-tree
# checker is Python-AST-only.
[project.entry-points."scitex_dev.linter.plugins"]
ui = "scitex_ui._linter_plugin:get_plugin"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-ui"
Repository = "https://github.com/ywatanabe1989/scitex-ui"
Documentation = "https://scitex-ui.readthedocs.io"

# Frontend source under static/ MUST ship in BOTH the sdist and the wheel.
# hatchling honors .gitignore, and the shared gitignore template's `**/*old*`
# rule (meant to drop `.old/` trash dirs) is a *substring* match — it
# accidentally hits real source files whose name merely contains "old", e.g.
# `_BinaryPlaceh(old)er.ts`. git tracks the file, but hatchling omits it from
# built artifacts, while an editable/source install still sees it. That skew is
# exactly what made the hub's baked scitex-ui wheel partial and broke its
# boot-time Vite build (missing _BinaryPlaceholder.ts).
#
# `artifacts` MUST live at the shared [tool.hatch.build] level, NOT just the
# wheel target: the release CI runs `python -m build`, which builds the sdist
# first and then the wheel FROM that sdist — so a wheel-only `artifacts` was too
# late (the file was already gone at the sdist stage; 0.6.2 shipped broken for
# this reason). Shared artifacts force-include these paths in EVERY target
# (sdist + wheel), holding regardless of which future filename trips an ignore.
[tool.hatch.build]
artifacts = [
    "src/scitex_ui/static/**/*.ts",
    "src/scitex_ui/static/**/*.tsx",
    "src/scitex_ui/static/**/*.css",
    "src/scitex_ui/static/**/*.html",
    "src/scitex_ui/static/**/*.js",
    # Brand/UI artwork. The shared gitignore's blanket `**/*.svg` rule targets
    # generated figures but also matches packaged assets — the shipped favicon
    # was silently dropped from the 0.7.0 wheel until this line was added.
    "src/scitex_ui/static/**/*.svg",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
parallel = true
source = ["scitex_ui"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]


[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
